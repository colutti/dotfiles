# Appearance parity with the previous Alacritty setup.
font_family JetBrainsMono Nerd Font
font_size 11.0

window_padding_width 12
placement_strategy center
hide_window_decorations yes

cursor_shape beam
cursor_blink_interval 0.5
enable_audio_bell no

# DMS/Matugen owns this generated palette.
globinclude dank-theme.conf

# Preserve Alt+V history navigation, using Neovim as Kitty's scrollback pager.
# Escape and q both close the purpose-specific Neovim instance.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap <Esc> ZQ' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
map alt+v show_scrollback
