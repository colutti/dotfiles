include=~/.local/state/colutti-desktop/generated/fuzzel-theme.ini

[main]
font=Noto Sans:size=14
terminal=alacritty -e
layer=overlay
lines=12
vertical-pad=18
inner-pad=8
image-size-ratio=0.5
icons-enabled=yes
use-bold=yes
dpi-aware=no
exit-on-keyboard-focus-loss=yes

[border]
width=2

[dmenu]
exit-immediately-if-empty=no
